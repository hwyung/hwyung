<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-labelledby="t d">
<title id="t">Stage 3: the factory pipeline</title>
<desc id="d">A GitHub issue goes through six steps: intake, spec writer, builder, an automated gate, two parallel reviewers, and an approver, ending in a pull request that a human merges. If reviewers ask for changes the job returns to the builder, up to three rounds.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<rect x="0.5" y="0.5" width="879" height="429" rx="14" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="30" y="40" font-size="19" font-weight="700" fill="#1F2328">Stage 3 · The factory pipeline</text>
<text x="30" y="62" font-size="13" fill="#57606A">One job at a time. Each agent writes one file; the next agent reads it.</text>

<rect x="430" y="24" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text x="448" y="34" font-size="12" fill="#57606A">Opus agent</text>
<rect x="540" y="24" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="558" y="34" font-size="12" fill="#57606A">Sonnet agent</text>
<rect x="650" y="24" width="12" height="12" rx="3" fill="#F6F8FA" stroke="#8C959F"/><text x="668" y="34" font-size="12" fill="#57606A">Script, no AI</text>
<rect x="765" y="24" width="12" height="12" rx="3" fill="#FAECE7" stroke="#993C1D"/><text x="783" y="34" font-size="12" fill="#57606A">Human</text>

<rect x="30" y="90" width="180" height="80" rx="10" fill="#F6F8FA" stroke="#8C959F"/>
<text x="44" y="112" font-size="14" font-weight="700" fill="#1F2328">GitHub issue</text>
<text x="44" y="133" font-size="12" fill="#57606A">or pre-written step files</text>
<text x="44" y="150" font-size="12" fill="#57606A">(the starting point)</text>

<rect x="250" y="90" width="180" height="80" rx="10" fill="#EEEDFE" stroke="#534AB7"/>
<text x="264" y="112" font-size="14" font-weight="700" fill="#26215C">1 · Intake</text>
<text x="264" y="133" font-size="12" fill="#3C3489">Is the issue clear enough</text>
<text x="264" y="150" font-size="12" fill="#3C3489">to plan? · Opus</text>

<rect x="470" y="90" width="180" height="80" rx="10" fill="#EEEDFE" stroke="#534AB7"/>
<text x="484" y="112" font-size="14" font-weight="700" fill="#26215C">2 · Spec writer</text>
<text x="484" y="133" font-size="12" fill="#3C3489">Writes a checkable spec</text>
<text x="484" y="150" font-size="12" fill="#3C3489">for the builder · Opus</text>

<rect x="690" y="90" width="180" height="80" rx="10" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="704" y="112" font-size="14" font-weight="700" fill="#04342C">3 · Builder</text>
<text x="704" y="133" font-size="12" fill="#085041">Codes on its own branch,</text>
<text x="704" y="150" font-size="12" fill="#085041">opens a draft PR · Sonnet</text>

<line x1="212" y1="130" x2="248" y2="130" stroke="#57606A" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="432" y1="130" x2="468" y2="130" stroke="#57606A" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="652" y1="130" x2="688" y2="130" stroke="#57606A" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="780" y1="172" x2="780" y2="238" stroke="#57606A" stroke-width="1.6" marker-end="url(#a)"/>

<rect x="690" y="240" width="180" height="80" rx="10" fill="#F6F8FA" stroke="#8C959F"/>
<text x="704" y="262" font-size="14" font-weight="700" fill="#1F2328">4 · Gate</text>
<text x="704" y="283" font-size="12" fill="#57606A">Unit tests, build, lint.</text>
<text x="704" y="300" font-size="12" fill="#57606A">Fails fast, before reviewers</text>

<rect x="470" y="240" width="180" height="38" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="484" y="256" font-size="12" font-weight="700" fill="#26215C">5 · Code review</text>
<text x="484" y="270" font-size="11" fill="#3C3489">Opus · runs in parallel</text>
<rect x="470" y="282" width="180" height="38" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="484" y="298" font-size="12" font-weight="700" fill="#04342C">5 · Guardrails review</text>
<text x="484" y="312" font-size="11" fill="#085041">Sonnet, Opus if risky</text>

<rect x="250" y="240" width="180" height="80" rx="10" fill="#EEEDFE" stroke="#534AB7"/>
<text x="264" y="262" font-size="14" font-weight="700" fill="#26215C">6 · Approver</text>
<text x="264" y="283" font-size="12" fill="#3C3489">Recommends approve or</text>
<text x="264" y="300" font-size="12" fill="#3C3489">escalate · Opus</text>

<rect x="30" y="240" width="180" height="80" rx="10" fill="#FAECE7" stroke="#993C1D"/>
<text x="44" y="262" font-size="14" font-weight="700" fill="#4A1B0C">7 · Pull request</text>
<text x="44" y="283" font-size="12" fill="#712B13">A human merges it.</text>
<text x="44" y="300" font-size="12" fill="#712B13">Always me, never an agent</text>

<line x1="688" y1="280" x2="652" y2="280" stroke="#57606A" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="468" y1="280" x2="432" y2="280" stroke="#57606A" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="248" y1="280" x2="212" y2="280" stroke="#57606A" stroke-width="1.6" marker-end="url(#a)"/>

<path d="M520 238 L520 208 L730 208 L730 174" fill="none" stroke="#993C1D" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#b)"/>
<text x="724" y="200" font-size="12" text-anchor="end" fill="#993C1D">Changes requested: up to 3 rounds</text>

<rect x="30" y="346" width="262" height="64" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
<text x="42" y="365" font-size="13" font-weight="700" fill="#1F2328">Risk router</text>
<text x="42" y="383" font-size="12" fill="#57606A">Schema, manifest, network or</text>
<text x="42" y="398" font-size="12" fill="#57606A">personal-data: Opus guardrails</text>
<rect x="309" y="346" width="262" height="64" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
<text x="321" y="365" font-size="13" font-weight="700" fill="#1F2328">Usage gate</text>
<text x="321" y="383" font-size="12" fill="#57606A">Before every agent runs, pause</text>
<text x="321" y="398" font-size="12" fill="#57606A">at 75% of my weekly limit</text>
<rect x="588" y="346" width="262" height="64" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
<text x="600" y="365" font-size="13" font-weight="700" fill="#1F2328">Files, not chat</text>
<text x="600" y="383" font-size="12" fill="#57606A">spec.md, build.md, review files,</text>
<text x="600" y="398" font-size="12" fill="#57606A">decision.md: all kept in the repo</text>
</g>
</svg>
