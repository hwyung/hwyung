<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290" role="img" aria-labelledby="t d">
<title id="t">My AI-assisted development journey</title>
<desc id="d">Three stages left to right: Stage 1 learn to prompt with Antigravity, Stage 2 split planner and coder between Claude and a local model, Stage 3 run an agent factory in Claude Code. One project, Cuizy, runs through all three.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<rect x="0.5" y="0.5" width="879" height="289" rx="14" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="30" y="40" font-size="21" font-weight="700" fill="#1F2328">My AI-assisted development journey</text>
<text x="30" y="62" font-size="13" fill="#57606A">Three ways of working, each one built on the lessons of the last</text>

<rect x="30" y="80" width="250" height="144" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="46" y="105" font-size="12" fill="#534AB7" font-weight="600">STAGE 1 · AUG 2026</text>
<text x="46" y="131" font-size="18" font-weight="700" fill="#26215C">Learn to prompt</text>
<text x="46" y="153" font-size="13" fill="#3C3489">Google Antigravity</text>
<line x1="46" y1="167" x2="264" y2="167" stroke="#AFA9EC"/>
<text x="46" y="189" font-size="13" fill="#26215C">Lesson: write the rules first,</text>
<text x="46" y="207" font-size="13" fill="#26215C">review the plan before any code.</text>

<line x1="284" y1="152" x2="316" y2="152" stroke="#57606A" stroke-width="1.6" marker-end="url(#a)"/>

<rect x="320" y="80" width="250" height="144" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text x="336" y="105" font-size="12" fill="#0F6E56" font-weight="600">STAGE 2 · AUG–OCT 2026</text>
<text x="336" y="131" font-size="18" font-weight="700" fill="#04342C">Planner and local coder</text>
<text x="336" y="153" font-size="13" fill="#085041">Claude + local LLMs + Cline</text>
<line x1="336" y1="167" x2="554" y2="167" stroke="#5DCAA5"/>
<text x="336" y="189" font-size="13" fill="#04342C">Lesson: small, checkable steps</text>
<text x="336" y="207" font-size="13" fill="#04342C">beat long plans. Verify, don't trust.</text>

<line x1="574" y1="152" x2="606" y2="152" stroke="#57606A" stroke-width="1.6" marker-end="url(#a)"/>

<rect x="610" y="80" width="240" height="144" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/>
<text x="626" y="105" font-size="12" fill="#993C1D" font-weight="600">STAGE 3 · NOV 2026</text>
<text x="626" y="131" font-size="18" font-weight="700" fill="#4A1B0C">Agent factory</text>
<text x="626" y="153" font-size="13" fill="#712B13">Claude Code, six role agents</text>
<line x1="626" y1="167" x2="834" y2="167" stroke="#F0997B"/>
<text x="626" y="189" font-size="13" fill="#4A1B0C">Lesson: agents build and review;</text>
<text x="626" y="207" font-size="13" fill="#4A1B0C">I test, decide and merge.</text>

<rect x="30" y="240" width="820" height="32" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
<text x="440" y="261" font-size="13" text-anchor="middle" fill="#1F2328">One project carried through all three: <tspan font-weight="700">Cuizy</tspan>, an offline recipe app for Android</text>
</g>
</svg>
